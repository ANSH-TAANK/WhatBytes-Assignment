<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Welcome{% endblock %} · CareDesk</title>
  <style>
    :root { --ink:#142844; --muted:#66768c; --blue:#2457d6; --line:#e0e7f0; --bg:#f4f7fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:var(--blue); font-weight:600; text-decoration:none; } a:hover { text-decoration:underline; }
    header { height:72px; display:flex; align-items:center; justify-content:space-between; max-width:1120px; margin:auto; padding:0 22px; }
    .brand { font-size:20px; font-weight:800; color:var(--ink); letter-spacing:-.4px; }
    .small { color:var(--muted); font-size:14px; }
    main { max-width:1040px; margin:48px auto 64px; padding:0 22px; }
    .welcome-grid { display:grid; grid-template-columns:1.05fr .95fr; gap:46px; align-items:center; }
    .intro { padding:20px 0; } .eyebrow { text-transform:uppercase; letter-spacing:.13em; color:var(--blue); font-size:12px; font-weight:750; }
    h1 { font-size:clamp(32px,5vw,48px); line-height:1.08; letter-spacing:-1.5px; margin:13px 0 17px; }
    h2 { font-size:22px; margin:0 0 5px; letter-spacing:-.3px; }
    .intro p { max-width:460px; color:var(--muted); font-size:17px; }
    .features { display:grid; gap:12px; margin-top:27px; }
    .feature { display:flex; gap:12px; align-items:flex-start; color:#465a74; }
    .check { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:#e3edff; color:var(--blue); font-size:13px; font-weight:800; flex:0 0 auto; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:30px; box-shadow:0 12px 36px #18365c0c; }
    .panel-intro { margin:0 0 22px; color:var(--muted); font-size:14px; }
    .row { margin-bottom:15px; } label { display:block; font-weight:650; font-size:13px; margin-bottom:6px; }
    input { width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:var(--ink); font:inherit; }
    input:focus { outline:3px solid #2457d620; border-color:var(--blue); }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:48px; }
    .password-toggle { position:absolute; right:7px; top:50%; transform:translateY(-50%); width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:6px; background:transparent; color:#52647c; cursor:pointer; }
    .password-toggle:hover { background:#eef3fa; color:var(--ink); }
    .password-toggle:focus-visible { outline:3px solid #2457d640; }
    .password-toggle svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .password-toggle .eye-off { display:none; }
    .password-toggle[aria-pressed="true"] .eye { display:none; }
    .password-toggle[aria-pressed="true"] .eye-off { display:block; }
    .help { display:block; color:var(--muted); font-size:12px; margin-top:5px; }
    .errorlist { margin:5px 0 0; padding-left:18px; color:#b42332; font-size:13px; }
    .error-summary { color:#b42332; background:#fff0f1; border:1px solid #ffd1d5; border-radius:8px; padding:10px 12px; margin-bottom:14px; }
    .btn { display:block; width:100%; margin-top:18px; border:0; border-radius:8px; padding:12px 16px; background:var(--blue); color:#fff; font:700 15px system-ui,sans-serif; cursor:pointer; }
    .btn:hover { background:#173fa8; }
    .switch { margin:19px 0 0; text-align:center; color:var(--muted); font-size:14px; }
    .login-main { max-width:500px; margin:76px auto; }
    .inline-links { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:16px; font-size:13px; }
    .notice { padding:13px 15px; background:#eef4ff; border:1px solid #d7e5ff; border-radius:9px; color:#344c6d; margin:14px 0; }
    @media(max-width:760px) { header { height:62px; padding:0 16px; } main { margin:25px auto 45px; padding:0 16px; } .welcome-grid { grid-template-columns:1fr; gap:20px; } .intro { padding:8px 0; } .features { display:none; } .panel { padding:23px; } .login-main { margin:40px auto; } }
  </style>
</head>
<body>
  <header><a class="brand" href="{% url 'welcome' %}">CareDesk</a><span class="small">Healthcare records, made simple</span></header>
  {% block body %}{% endblock %}
  <script>
    document.querySelectorAll('input[type="password"]').forEach((input, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'password-wrap';
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'password-toggle';
      toggle.setAttribute('aria-label', 'Show password');
      toggle.setAttribute('aria-pressed', 'false');
      toggle.setAttribute('aria-controls', input.id || `password-field-${index}`);
      if (!input.id) input.id = `password-field-${index}`;
      toggle.title = 'Show password';
      toggle.innerHTML = '<svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 4.1-.8"/></svg>';
      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        toggle.title = show ? 'Hide password' : 'Show password';
      });
      wrapper.appendChild(toggle);
    });
  </script>
</body>
</html>
